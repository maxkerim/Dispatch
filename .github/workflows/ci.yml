name: CI and kind smoke test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Test
        run: python -m pytest

  kind-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: helm/kind-action@v1.10.0

      - uses: azure/setup-helm@v4

      - name: Build image
        run: docker build -t dispatch-api:${GITHUB_SHA} .

      - name: Validate Helm chart
        run: helm lint ./helmchart

      - name: Start PostgreSQL in kind
        run: |
          kubectl create secret generic dispatch-db \
            --from-literal=POSTGRES_DB=dispatch \
            --from-literal=POSTGRES_USER=dispatch \
            --from-literal=POSTGRES_PASSWORD=dispatch \
            --from-literal=DATABASE_URL=postgresql+psycopg://dispatch:dispatch@dispatch-db:5432/dispatch

          kubectl apply -f - <<'YAML'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: dispatch-db
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: dispatch-db
            template:
              metadata:
                labels:
                  app: dispatch-db
              spec:
                containers:
                  - name: postgres
                    image: postgres:16-alpine
                    ports:
                      - containerPort: 5432
                    env:
                      - name: POSTGRES_DB
                        valueFrom:
                          secretKeyRef:
                            name: dispatch-db
                            key: POSTGRES_DB
                      - name: POSTGRES_USER
                        valueFrom:
                          secretKeyRef:
                            name: dispatch-db
                            key: POSTGRES_USER
                      - name: POSTGRES_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: dispatch-db
                            key: POSTGRES_PASSWORD
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: dispatch-db
          spec:
            selector:
              app: dispatch-db
            ports:
              - port: 5432
                targetPort: 5432
          YAML

          kubectl rollout status deployment/dispatch-db --timeout=120s

      - name: Deploy API
        run: |
          kind load docker-image dispatch-api:${GITHUB_SHA}

          helm upgrade --install dispatch ./helmchart \
            --set image.repository=dispatch-api \
            --set-string image.tag=${GITHUB_SHA} \
            --set image.pullPolicy=IfNotPresent \
            --set service.type=ClusterIP

          kubectl rollout status deployment/dispatch-api --timeout=120s

      - name: Smoke test readiness
        run: |
          kubectl run dispatch-smoke \
            --rm -i --restart=Never \
            --image=curlimages/curl:8.12.1 \
            --command -- curl --fail --retry 10 --retry-connrefused \
            --retry-delay 2 http://dispatch-api:8000/ready

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: kind-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
